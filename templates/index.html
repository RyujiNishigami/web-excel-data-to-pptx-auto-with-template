<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Data & Template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h3 class="mb-4 text-center">1. Upload Data & Template</h3>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form action="/preview" method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">อัปโหลดไฟล์ Excel (Data)</label>
                        <input type="file" name="excel_file" class="form-control" accept=".xlsx, .xls" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">อัปโหลดไฟล์ PowerPoint (Template)</label>
                        <input type="file" name="pptx_file" class="form-control" accept=".pptx" multiple required>
                        <small class="text-muted text-success">รองรับการอัปโหลดหลายไฟล์พร้อมกัน (คลุมดำเลือกได้เลย)</small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Next</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
